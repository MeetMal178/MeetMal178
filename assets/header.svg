<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="20s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <!-- waves -->
    <path fill="#ffffff" fill-opacity="0.07" d="M0 150 C150 110 300 190 450 150 S750 110 900 150 V220 H0Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 150 C150 110 300 190 450 150 S750 110 900 150 V220 H0Z;
                M0 150 C150 190 300 110 450 150 S750 190 900 150 V220 H0Z;
                M0 150 C150 110 300 190 450 150 S750 110 900 150 V220 H0Z"/>
    </path>
    <path fill="#ffffff" fill-opacity="0.05" d="M0 170 C200 140 300 200 450 170 S700 140 900 170 V220 H0Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 170 C200 140 300 200 450 170 S700 140 900 170 V220 H0Z;
                M0 170 C200 200 300 140 450 170 S700 200 900 170 V220 H0Z;
                M0 170 C200 140 300 200 450 170 S700 140 900 170 V220 H0Z"/>
    </path>
    <!-- floating dots -->
    <g fill="#00f5a0" fill-opacity="0.6">
      <circle cx="80" cy="50" r="3"><animate attributeName="cy" values="50;35;50" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="70" r="4"><animate attributeName="cy" values="70;50;70" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="30" r="2"><animate attributeName="cy" values="30;45;30" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
    <text x="450" y="95" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="url(#txt)">
      Hi, I'm YOUR NAME 👋
      <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
    </text>
    <text x="450" y="140" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" fill="#e6f1ff">
      <tspan>Student · Developer · Problem Solver</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.5s" fill="freeze"/>
    </text>
  </g>
</svg>
